# Build docs/ Jupyter Book and publish to GitHub Pages (gh-pages branch).
#
# Pages settings (one time):
#   Settings → Pages → Source = "Deploy from a branch"
#   Branch = gh-pages / (root)
name: Publish Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter Book
        run: pip install "jupyter-book>=1.0.0"

      - name: Set GitHub Pages base URL
        run: |
          sed -i 's|^  baseurl:.*|  baseurl: "/shoreshop3_2026_pipeline"|' docs/_config.yml

      - name: Build book
        run: jupyter-book build docs

      - name: Prepare site (drop non-public build extras)
        run: |
          test -f docs/_build/html/index.html
          rm -rf docs/_build/html/_sources docs/_build/html/_downloads
          touch docs/_build/html/.nojekyll
          du -sh docs/_build/html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
