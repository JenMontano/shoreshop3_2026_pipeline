# Build docs/ Jupyter Book and publish to GitHub Pages (gh-pages branch).
#
# Pages settings:
#   Settings → Pages → Deploy from a branch → gh-pages / (root)
name: Publish Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter Book
        run: pip install "jupyter-book>=1.0.0" linkify-it-py

      - name: Set GitHub Pages base URL
        run: |
          sed -i 's|^  baseurl:.*|  baseurl: "/shoreshop3_2026_pipeline"|' docs/_config.yml

      - name: Build book
        run: jupyter-book build docs

      - name: Prepare site
        run: |
          HTML=docs/_build/html
          if [ ! -d "$HTML" ]; then
            echo "ERROR: $HTML not found after build"
            exit 1
          fi
          rm -rf "$HTML/_sources" "$HTML/_downloads"
          touch "$HTML/.nojekyll"
          if [ ! -f "$HTML/index.html" ] && [ -f "$HTML/intro.html" ]; then
            cp "$HTML/intro.html" "$HTML/index.html"
          fi
          if [ ! -f "$HTML/index.html" ] && [ ! -f "$HTML/intro.html" ]; then
            echo "ERROR: no index.html or intro.html in build output"
            ls -la "$HTML"
            exit 1
          fi
          du -sh "$HTML"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
